plugins {
    // see https://fabricmc.net/develop/ for new versions
    id 'fabric-loom' version '1.17-SNAPSHOT' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.146' apply false
    id 'org.moddedmc.wiki.toolkit' version '0.5.0'
}

//This is used for the live preview of the wiki
wiki {
    wikiAccessToken = System.getenv("WIKI_ACCESS_TOKEN")
    docs {
        sullysmod {
            root = file('wiki')
        }
    }
}
